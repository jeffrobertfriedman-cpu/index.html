<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Career timeline</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F6F9; --card:#FFFFFF; --ink:#1F2A37; --muted:#5F6B7A; --line:#DDE4EE; --navy:#173F73;
  --p1:#F3F6FA; --p2:#EAF6F2; --p3:#EAF1FB; --track:#E3E9F1; --accent:#2A5DA8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161F; --card:#18212C; --ink:#E6ECF4; --muted:#9AA7B8; --line:#2A3646; --navy:#173F73;
    --p1:#18212C; --p2:#152622; --p3:#16263A; --track:#2A3646; --accent:#8DB5EE;
  }
}
:root[data-theme="dark"]{
  --bg:#10161F; --card:#18212C; --ink:#E6ECF4; --muted:#9AA7B8; --line:#2A3646; --navy:#173F73;
  --p1:#18212C; --p2:#152622; --p3:#16263A; --track:#2A3646; --accent:#8DB5EE;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{background:var(--navy);color:#fff;border-radius:14px;padding:20px 24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end}
h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:700;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:#D6E2F3;font-size:14px}
.stats{display:grid;grid-template-columns:auto auto;gap:2px 16px;font-size:14px;color:#D6E2F3}
.stats b{color:#fff;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 2px 6px;font-size:14px;color:var(--muted)}
.ctl input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.ctl button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.ctl button:focus-visible,.ctl input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#today{color:var(--ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.gwrap{padding:34px 12px 34px}
.gantt{--gut:0px;position:relative;margin-left:var(--gut)}
.axis{position:absolute;top:-22px;left:0;right:0;height:16px}
.axis span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.gl{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--line);z-index:1;pointer-events:none}
.grow{position:relative;height:46px}
.grow:nth-child(odd)::before{content:"";position:absolute;top:0;bottom:0;left:calc(-1*var(--gut) - 6px);right:-6px;background:color-mix(in srgb,var(--muted) 8%,transparent);border-radius:6px}
.glab{position:absolute;top:3px;left:0;right:0;display:flex;justify-content:space-between;gap:8px;font-size:13.5px;z-index:2}
.glab .du{color:var(--muted);font-size:12px;white-space:nowrap}
.glab.cur .nm{font-weight:700}
.gb{position:absolute;top:24px;height:14px;left:var(--l);width:var(--w);min-width:4px;border-radius:3px;border:1px solid rgba(0,0,0,.25);z-index:2;transition:left .4s,width .4s}
.gb.rem{border:1.5px dashed #D9861A}
.gb.cur{outline:2px solid var(--ink);outline-offset:1px}
.tline{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed #E24B4A;z-index:3;pointer-events:none}
.tline::after{content:"Today";position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:#E24B4A;white-space:nowrap}
@media (min-width:860px){
  .gantt{--gut:250px}
  .grow{height:32px}
  .glab{display:block;left:auto;right:calc(100% - var(--l) + 10px);top:7px;white-space:nowrap;text-align:right}
  .glab .du{margin-left:4px}
  .gb{top:9px}
}
.note{font-size:12px;color:var(--muted);margin:8px 2px 0}
.grid{display:grid;gap:14px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
h2{
